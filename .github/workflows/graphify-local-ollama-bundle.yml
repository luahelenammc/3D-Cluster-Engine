name: Offline Ollama CPU-only bundle for Graphify private pilot

on:
  push:
    branches: [experiment/graphify-synthetic-20261104]

permissions:
  contents: read

jobs:
  package-public-model-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_MODELS: "${{ github.workspace }}/ollama_models"
    steps:
      - name: Install official Ollama without any user files
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh -o /tmp/install_ollama.sh
          sudo sh /tmp/install_ollama.sh
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve >/tmp/ollama_server.log 2>&1 &
          for i in $(seq 1 35); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break || sleep 1
          done
      - name: Download public compact model, no private prompts or data
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen2.5:0.5b
          ollama list
          test -d "$OLLAMA_MODELS/blobs"
      - name: Copy only CPU shared libraries and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/bin package/lib/ollama package/models
          cp -L "$(command -v ollama)" package/bin/ollama
          if test -d /usr/local/lib/ollama; then
            du -h --max-depth=2 /usr/local/lib/ollama | tail -40
            for f in /usr/local/lib/ollama/*.so /usr/local/lib/ollama/*.so.*; do
              test -e "$f" && cp -a "$f" package/lib/ollama/ || true
            done
            for d in /usr/local/lib/ollama/*cpu*; do
              test -d "$d" && cp -a "$d" package/lib/ollama/ || true
            done
          fi
          cp -a "$OLLAMA_MODELS"/. package/models/
          (cd package && tar -cf ../ollama_public_cpu_bundle.tar bin lib models)
          sha256sum ollama_public_cpu_bundle.tar > ollama_public_cpu_bundle.sha256
          du -h ollama_public_cpu_bundle.tar
          mkdir -p artifact_parts
          split -d -a 2 -b 95m ollama_public_cpu_bundle.tar artifact_parts/part-
          sha256sum artifact_parts/* > artifact_parts/parts.sha256
          cp ollama_public_cpu_bundle.sha256 artifact_parts/
          find artifact_parts -type f -printf '%f %s bytes\n'
      - name: Upload checksums for safe reconstruction
        uses: actions/upload-artifact@v4
        with:
          name: ollama-cpu-manifests
          path: |
            artifact_parts/parts.sha256
            artifact_parts/ollama_public_cpu_bundle.sha256
          retention-days: 2
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: ollama-cpu-part-00
          path: artifact_parts/part-00
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: ollama-cpu-part-01
          path: artifact_parts/part-01
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: ollama-cpu-part-02
          path: artifact_parts/part-02
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: ollama-cpu-part-03
          path: artifact_parts/part-03
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: ollama-cpu-part-04
          path: artifact_parts/part-04
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: ollama-cpu-part-05
          path: artifact_parts/part-05
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: ollama-cpu-part-06
          path: artifact_parts/part-06
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with:
          name: ollama-cpu-part-07
          path: artifact_parts/part-07
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 2
