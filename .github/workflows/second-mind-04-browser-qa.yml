name: Second Mind 0.4 browser QA
on:
  push:
    branches:
      - feature/second-mind-knowledge-compiler-04
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  second-mind-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install isolated QA browser
        run: |
          mkdir -p .qa-browser
          npm install --prefix .qa-browser --no-save --no-package-lock playwright@1.56.1
          ./.qa-browser/node_modules/.bin/playwright install chromium
      - name: Browser smoke desktop and mobile
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/knowledge-04-vite.log 2>&1 &
          for i in $(seq 1 35); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ >/dev/null
          node scripts/second-mind-04-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: second-mind-04-screenshots
          path: qa-artifacts/
          retention-days: 3
          if-no-files-found: warn
