name: Knowledge Engine integration QA

on:
  push:
    branches:
      - feature/knowledge-engine-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:companion
      - run: npm run build
      - name: Archive source for offline audit
        if: always()
        shell: bash
        run: |
          git archive --format=tar HEAD -o /tmp/knowledge-source.tar
          mkdir -p /tmp/source-for-audit
          cp /tmp/knowledge-source.tar /tmp/source-for-audit/
      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-engine-source-snapshot
          path: /tmp/source-for-audit/knowledge-source.tar
          retention-days: 2
          if-no-files-found: warn
